<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.4" stroke-dasharray="16 12" />

  <!-- Core Glowing Sphere / Hexagon -->
  <circle cx="256" cy="256" r="120" fill="url(#primaryGrad)" filter="url(#neonGlow)" />

  <!-- Stylized Sound Waves / Speech Bubble / 'L' + 'P' monogram -->
  <!-- Sound Wave Bars -->
  <rect x="180" y="220" width="16" height="72" rx="8" fill="#ffffff" opacity="0.9" />
  <rect x="212" y="180" width="16" height="152" rx="8" fill="#ffffff" />
  <rect x="248" y="150" width="16" height="212" rx="8" fill="#ffffff" />
  <rect x="284" y="190" width="16" height="132" rx="8" fill="#ffffff" />
  <rect x="316" y="230" width="16" height="52" rx="8" fill="#ffffff" opacity="0.9" />

  <!-- Headphone Arc Accent -->
  <path d="M 160 260 C 160 180, 352 180, 352 260" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.8" />
</svg>
